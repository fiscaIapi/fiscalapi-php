name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: composer
      - run: composer validate --strict
      - run: find src examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer dump-autoload
      - name: Smoke test (autoload sem rede)
        run: php -r "require 'vendor/autoload.php'; new FiscalApiBr\FiscalAPI('x'); echo 'ok', PHP_EOL;"
